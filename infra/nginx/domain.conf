limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name agentradar.site www.agentradar.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://agentradar.site$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.agentradar.site;
    ssl_certificate /etc/letsencrypt/live/agentradar.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentradar.site/privkey.pem;
    return 301 https://agentradar.site$request_uri;
}

server {
    listen 443 ssl http2;
    server_name agentradar.site;
    ssl_certificate /etc/letsencrypt/live/agentradar.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentradar.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 1m;

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://backend:8000;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://frontend:80;
    }
}
