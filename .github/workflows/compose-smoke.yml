name: Compose smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements/base.txt -r backend/requirements/knowledge.txt -r backend/requirements/dev.txt
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py check
      - run: ruff check backend
      - run: pytest backend
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run type-check && npm run test && npm run build
        working-directory: frontend

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare local environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start dependencies and run explicit migration
        run: |
          docker compose up --detach postgres redis
          docker compose run --rm backend python manage.py migrate --noinput

      - name: Build and start services
        run: docker compose up --build --detach

      - name: Wait for Backend and Frontend proxy health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:5173/api/v1/health/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Verify infrastructure and Celery
        run: |
          docker compose exec -T postgres pg_isready -U agentradar -d agentradar
          test "$(docker compose exec -T postgres psql -U agentradar -d agentradar -tAc 'SELECT 1;')" = "1"
          test "$(docker compose exec -T redis redis-cli ping)" = "PONG"
          docker compose exec -T celery-worker celery -A config inspect ping --timeout 10
          docker compose ps --status running

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down --volumes
