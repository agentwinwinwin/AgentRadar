name: Bug report
description: 报告可复现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请勿提交 Token、密码、服务器地址、用户数据或未公开漏洞。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明期望行为与实际行为。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: "OS / Browser / Docker / Commit"
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或截图
      description: 上传前请移除所有账号、Token、IP 与个人信息。
