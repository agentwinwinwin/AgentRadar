services:
  postgres:
    ports: !reset []
    restart: unless-stopped
  redis:
    ports: !reset []
    restart: unless-stopped
  backend:
    ports: !reset []
    expose: ["8000"]
    restart: unless-stopped
  celery-worker:
    command: celery -A config worker --loglevel=info --concurrency=1 --prefetch-multiplier=1 --hostname=background@%h --queues=celery,github_normal,github_backfill,knowledge
    restart: unless-stopped
  celery-scoring:
    command: celery -A config worker --loglevel=info --concurrency=1 --prefetch-multiplier=1 --hostname=scoring@%h --queues=operations,scoring
    restart: unless-stopped
  celery-interactive:
    command: celery -A config worker --loglevel=info --concurrency=1 --prefetch-multiplier=1 --hostname=interactive@%h --queues=interactive
    restart: unless-stopped
  celery-ml:
    command: celery -A config worker --loglevel=info --concurrency=1 --prefetch-multiplier=1 --hostname=ml@%h --queues=ml
    restart: unless-stopped
    cpus: 1.0
  celery-beat:
    restart: unless-stopped
  frontend:
    ports: !reset []
    expose: ["80"]
    restart: unless-stopped
  reverse-proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
